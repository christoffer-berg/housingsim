[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housingsim"
version = "0.1.0"
description = "Swedish housing market agent-based simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
ui = [
    "streamlit>=1.32",
    "plotly>=5.20",
    "openpyxl>=3.1",
]

[project.scripts]
housingsim = "scripts.run_simulation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["housingsim*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
